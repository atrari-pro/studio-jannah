name: CI checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build & lint
        run: bash .claude/hooks/check-build.sh

      - name: Liens internes
        run: bash .claude/hooks/check-links.sh

      - name: Tracking sj_*
        run: bash .claude/hooks/check-datalayer.sh
