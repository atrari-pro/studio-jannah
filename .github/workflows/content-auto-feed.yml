name: Auto-feed Blog (Gemini)

# Moteur d'auto-alimentation du Blog — 100% Gemini gratuit, aucun crédit
# Claude consommé. Voir scripts/blog-generate.mjs pour la logique (recherche
# via grounding Google Search + rédaction structurée) et
# docs/CONTENT_AUTO_FEED.md pour la configuration complète.
#
# Cadence par défaut : mardi + vendredi, 08:00 UTC (~2 articles/semaine si
# la recherche trouve un angle valable — silence sinon, aucun commit).
# "Je veux plus cette semaine" : lancer ce workflow manuellement
# (workflow_dispatch, bouton "Run workflow" sur GitHub, ou `gh workflow run
# content-auto-feed.yml`), autant de fois que voulu.

on:
  schedule:
    - cron: "0 8 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-auto-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pas de `pnpm install` : scripts/blog-generate.mjs n'utilise que des
      # modules Node natifs (fs, path, url, fetch), aucune dépendance npm.
      - name: Générer un article (recherche + rédaction)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/blog-generate.mjs

      - name: Détecte si un article a été écrit
        id: detect
        run: |
          NEW_FILE=$(git status --porcelain apps/web/content/insights | awk '{print $2}' | head -1)
          if [ -n "$NEW_FILE" ]; then
            echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"
            echo "has_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvre la PR de brouillon
        if: steps.detect.outputs.has_draft == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SLUG=$(basename "${{ steps.detect.outputs.file }}" .md)
          TITLE=$(grep -m1 '^title:' "${{ steps.detect.outputs.file }}" | sed -E 's/^title:\s*"?//; s/"?$//')
          BRANCH="content/auto-${SLUG}"

          git config user.name "studio-jannah-bot"
          git config user.email "bot@atrari.pro"
          git checkout -b "$BRANCH"
          git add apps/web/content/insights .claude/agents/research.notes.md

          {
            echo "content: ${TITLE} (auto, Gemini)"
            echo ""
            echo "Généré automatiquement par le moteur d'auto-alimentation Blog"
            echo "(scripts/blog-generate.mjs) — recherche via grounding Google Search,"
            echo "rédaction structurée, sources vérifiées (HEAD-résolues, jamais une URL"
            echo "inventée par le modèle). Toujours status: draft — vérification manuelle"
            echo "avant publication (voir docs/CONTENT_AUTO_FEED.md)."
            echo ""
            echo "🤖 Generated with GitHub Actions (Auto-feed Blog)"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"

          {
            echo "Brouillon généré automatiquement par le moteur d'auto-alimentation (100% Gemini, aucun crédit Claude consommé)."
            echo ""
            echo "**Toujours \`status: draft\`** — vérification manuelle requise avant publication :"
            echo "- [ ] Sources vérifiées (déjà HEAD-résolues côté script, mais à relire)"
            echo "- [ ] Ton éditorial, pas de doublon avec un article existant"
            echo "- [ ] Liens internes corrects"
            echo "- [ ] \`status: draft\` → \`published\` une fois validé"
            echo ""
            echo "Voir \`docs/CONTENT_AUTO_FEED.md\`."
            echo ""
            echo "🤖 Generated with GitHub Actions (Auto-feed Blog)"
          } > /tmp/pr-body.txt

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "content: ${TITLE} (auto)" \
            --body-file /tmp/pr-body.txt)

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Notifie Telegram (best-effort)
        if: steps.detect.outputs.has_draft == 'true' && steps.pr.outputs.url != ''
        continue-on-error: true
        env:
          DRAFT_WEBHOOK_SECRET: ${{ secrets.DRAFT_WEBHOOK_SECRET }}
          # Passés en env plutôt qu'interpolés directement dans le script
          # bash : un titre d'article (texte libre généré par Gemini)
          # pourrait contenir des guillemets/backticks et casser la
          # commande si substitué tel quel par ${{ }} dans `run:`.
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          BODY=$(node -e 'console.log(JSON.stringify({title: process.env.PR_TITLE, prUrl: process.env.PR_URL}))')
          curl -fsS -X POST "https://eileoaxbxiimmrcakhcy.supabase.co/functions/v1/notify-draft" \
            -H "x-webhook-secret: $DRAFT_WEBHOOK_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY"
