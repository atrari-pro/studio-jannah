name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          GITHUB_ACTIONS: "true"
          PUBLIC_BASE_PATH: /studio-jannah
          PUBLIC_SITE_URL: https://atrari-pro.github.io/studio-jannah
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build:web

      # continue-on-error : un souci sur apps/app (démo + admin) ne doit
      # jamais empêcher le déploiement du site public (apps/web).
      - name: Build app (démo + admin)
        id: build_app
        continue-on-error: true
        env:
          GITHUB_ACTIONS: "true"
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build:app

      - name: Merger app dans web/dist/app-demo
        if: steps.build_app.outcome == 'success'
        run: |
          mkdir -p apps/web/dist/app-demo
          cp -r apps/app/dist/. apps/web/dist/app-demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # GEO/SEO : pousse toutes les URLs du sitemap à IndexNow (Bing,
      # Yandex — alimente aussi ChatGPT Search/Copilot via l'index Bing) à
      # chaque déploiement, plutôt que d'attendre un crawl naturel. Clé
      # hébergée dans apps/web/public/ (voir docs/DEPLOY_PAGES_SUPABASE.md).
      # Best-effort : ne bloque jamais le déploiement si IndexNow est
      # indisponible.
      - name: Ping IndexNow (Bing/Yandex)
        continue-on-error: true
        run: |
          SITE_URL="https://atrari-pro.github.io/studio-jannah"
          KEY="46190ef6e1d6e7d5c37b30c9d7c4238e"
          URLS_JSON=$(curl -fsS "$SITE_URL/sitemap.xml" \
            | grep -oP '(?<=<loc>)[^<]+' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg host "atrari-pro.github.io" --arg key "$KEY" \
                --arg keyLocation "$SITE_URL/$KEY.txt" --argjson urlList "$URLS_JSON" \
                '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"
